name: Deploy to Railway

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Railway
        run: |
          echo "Push to master detected. Railway should auto-deploy."
          echo "If Railway is connected via GitHub integration, deployment happens automatically."
          echo "Check Railway dashboard: https://railway.app/project/2d6733a1-a513-4a88-9438-28b58633a5a4"
